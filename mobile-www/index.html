<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Komy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0D0A26;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #141132;
      border: 1px solid #2e266d;
      border-radius: 28px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      text-align: center;
    }
    .logo-img {
      width: 112px;
      height: 112px;
      border-radius: 24px;
      object-fit: cover;
      margin: 0 auto 14px;
      box-shadow: 0 10px 30px -5px rgba(139, 92, 246, 0.5);
      border: 2px solid rgba(167, 139, 250, 0.35);
    }
    h1 { font-size: 26px; font-weight: 900; margin-bottom: 6px; color: #fff; letter-spacing: 0.5px; }
    p.sub { font-size: 13px; color: #c4b5fd; margin-bottom: 20px; line-height: 1.45; }
    .status-box {
      padding: 12px;
      border-radius: 14px;
      background: #09071a;
      border: 1px solid #2e266d;
      font-size: 12px;
      color: #c4b5fd;
      margin-bottom: 18px;
      word-break: break-all;
    }
    label {
      display: block;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: #a1a1aa;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid #3f3f46;
      background: #09071a;
      color: #fff;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus { border-color: #8b5cf6; }
    .btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.85; }
    .btn-secondary {
      background: #1f1b45;
      color: #e4e4e7;
      font-size: 12px;
      padding: 10px;
    }
    .presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(139, 92, 246, 0.3);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <img src="komy-logo.png" alt="Komy Logo" class="logo-img" />
    <h1>Komy</h1>
    <p class="sub">
      Tu Biblioteca de Mangas y Libros
    </p>

    <div id="loadingIndicator">
      <div class="spinner"></div>
    </div>

    <div id="statusBox" class="status-box">
      Conectando a la nube oficial de Komy (https://komy-manga.vercel.app)...
    </div>

    <div>
      <label for="serverUrl">URL de tu Servidor (Nube 24/7 o Local):</label>
      <input
        id="serverUrl"
        type="url"
        placeholder="https://komy-manga.vercel.app"
        value="https://komy-manga.vercel.app"
      />
      <button class="btn" onclick="connectToServer()">
        Entrar a Komy →
      </button>
    </div>

    <div class="presets">
      <button class="btn btn-secondary" onclick="setPreset('https://komy-manga.vercel.app')">
        ☁️ Servidor Nube 24/7
      </button>
      <button class="btn btn-secondary" onclick="setPreset('http://10.0.2.2:3000')">
        📱 Emulador Local (10.0.2.2)
      </button>
    </div>
  </div>

  <script>
    const PROD_URL = "https://komy-manga.vercel.app?app=true";
    // Navigate immediately to production web
    window.location.replace(PROD_URL);
  </script>
</body>
</html>
